<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studienplaner TI</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#172026" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Studium">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=2">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<script src="store.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: schmale Kopfzeile mit Reitern, darunter eine Spalte (Überblick) bzw. Raster (Plan) — Werkbank eines Ingenieurs, kühl, ruhig, ein Signalton */
:root{
  --bg:#f3f5f6; --panel:#ffffff; --ink:#15202b; --muted:#5a6772; --line:#dde3e7;
  --accent:#0f7c8c; --accent-soft:#e1f1f3;
  --ok:#2f8a4a; --ok-soft:#e3f2e7; --warn:#b26a00; --warn-soft:#fbefdc; --bad:#b3362c; --bad-soft:#f8e3e1; --info:#3d5fa8; --info-soft:#e5ebf7;
  --f-display:"Space Grotesk",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1519; --panel:#172026; --ink:#e4eaee; --muted:#93a1ab; --line:#26333b;
  --accent:#4cc0cf; --accent-soft:#143239;
  --ok:#66c27f; --ok-soft:#173225; --warn:#e3a54a; --warn-soft:#352813; --bad:#ef7d72; --bad-soft:#3a1d1a; --info:#8fa9e6; --info-soft:#1c2640; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1519; --panel:#172026; --ink:#e4eaee; --muted:#93a1ab; --line:#26333b;
  --accent:#4cc0cf; --accent-soft:#143239;
  --ok:#66c27f; --ok-soft:#173225; --warn:#e3a54a; --warn-soft:#352813; --bad:#ef7d72; --bad-soft:#3a1d1a; --info:#8fa9e6; --info-soft:#1c2640; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.15rem;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:.75rem;color:var(--muted)}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav a{color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:6px;font-weight:500}
nav a:hover{color:var(--ink);background:var(--bg)}
nav a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
main{padding-block:24px 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.6rem} h2{font-size:1.15rem} h3{font-size:1rem}
.lead{color:var(--muted);margin:4px 0 0;max-width:65ch}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.panel>h2{margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.stack{display:flex;flex-direction:column;gap:20px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.notice{background:var(--warn-soft);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:.9rem}
.notice b{color:var(--warn)}
/* progress */
.progress{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line);margin:10px 0 8px}
.progress span{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:14px}
.kpi b{display:block;font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.kpi span{font-size:.82rem;color:var(--muted)}
/* lists */
ul.clean{list-style:none;margin:0;padding:0}
.ev{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.date{font-family:var(--f-mono);font-size:.8rem;text-align:center;border:1px solid var(--line);border-radius:6px;padding:4px 0;line-height:1.2}
.date b{display:block;font-size:1.15rem;font-family:var(--f-display)}
.ev .t{min-width:0}
.ev .t div{overflow-wrap:anywhere}
.days{font-family:var(--f-mono);font-size:.8rem;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.s-bestanden{background:var(--ok-soft);color:var(--ok)}
.s-läuft{background:var(--info-soft);color:var(--info)}
.s-offen{background:var(--warn-soft);color:var(--warn)}
.s-unklar{background:transparent;color:var(--muted);border-color:var(--line);border-style:dashed}
.s-nb{background:var(--bad-soft);color:var(--bad)}
.t-Klausur{background:var(--bad-soft);color:var(--bad)}
.t-Abgabe{background:var(--warn-soft);color:var(--warn)}
.t-Termin{background:var(--info-soft);color:var(--info)}
.t-Zeitraum{background:var(--accent-soft);color:var(--accent)}
.ann{font-size:.72rem;color:var(--warn);font-family:var(--f-mono)}
.task{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.task input{margin-top:4px;accent-color:var(--accent)}
.task.done span{text-decoration:line-through;color:var(--muted)}
/* modules */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:5px 12px;border-radius:999px;font:inherit;font-size:.85rem;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.mod{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0}
.mod:hover{border-color:var(--accent)}
.mod .row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.mod h3{overflow-wrap:anywhere}
.meta{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);font-family:var(--f-mono)}
/* plan */
.plan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col header{position:static;border:0;background:none;display:flex;justify-content:space-between;align-items:baseline;padding-bottom:6px;border-bottom:1px solid var(--line)}
.pcard{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.pcard .row{display:flex;justify-content:space-between;gap:6px;align-items:center}
.pcard button.name{all:unset;cursor:pointer;font-weight:500;overflow-wrap:anywhere}
.pcard button.name:focus-visible{outline:2px solid var(--accent)}
.mv{display:flex;gap:4px}
.mv button{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:4px;width:26px;height:24px;cursor:pointer;font:inherit;line-height:1}
.mv button:hover{color:var(--accent);border-color:var(--accent)}
/* calendar */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-head h2{flex:1}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);text-align:center;padding:4px 0}
.cell{min-height:78px;border:1px solid var(--line);border-radius:6px;padding:4px;font-size:.75rem;background:var(--panel);min-width:0;overflow:hidden}
.cell.other{opacity:.45}
.cell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cell .d{font-family:var(--f-mono);color:var(--muted)}
.cell .e{display:block;border-radius:3px;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .e.range{opacity:.75}
@media (max-width:640px){.cell{min-height:52px}.cell .e{font-size:0;height:6px;padding:0}}
/* week */
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:820px){.week{grid-template-columns:1fr}}
.day{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day header{position:static;background:none;border:0;border-bottom:1px solid var(--line);padding-bottom:6px;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.slot{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:7px 9px;background:var(--bg);display:flex;flex-direction:column;gap:2px;min-width:0;overflow-wrap:anywhere}
.slot.off{opacity:.45;border-left-color:var(--line)}
.slot.ev-Klausur{border-left-color:var(--bad);background:var(--bad-soft)}
.slot.ev-Abgabe{border-left-color:var(--warn);background:var(--warn-soft)}
.slot.ev-Termin{border-left-color:var(--info);background:var(--info-soft)}
/* assistant */
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;border-radius:999px;padding:12px 18px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.chat{display:flex;flex-direction:column;gap:10px;flex:1;min-height:120px}
.bubble{padding:9px 12px;border-radius:10px;max-width:92%;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.93rem}
.bubble.me{align-self:flex-end;background:var(--accent-soft)}
.bubble.ai{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.bubble.log{align-self:flex-start;font-family:var(--f-mono);font-size:.75rem;color:var(--muted);padding:2px 4px}
/* buttons & forms */
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:7px 14px;font:inherit;font-weight:500;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn.danger{color:var(--bad)}
.btn.small{padding:3px 10px;font-size:.85rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);min-width:0}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.form .full{grid-column:1/-1}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,20,25,.4);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--panel);z-index:21;overflow-y:auto;border-left:1px solid var(--line);
  padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) 20px;display:flex;flex-direction:column;gap:16px}
.drawer .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.addrow{display:flex;gap:8px}
.addrow input{flex:1}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}
.status-line{font-size:.8rem;color:var(--muted);font-family:var(--f-mono)}

/* ---------- kompakte Terminkarten ---------- */
ul.clean:has(> .ev2){display:flex;flex-direction:column;gap:8px}
.ev2{grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:stretch;padding:10px 12px 10px 10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;position:relative;transition:border-color .15s,transform .1s}
.ev2:first-child{border-top:1px solid var(--line)}
@media (hover:hover){.ev2:hover{border-color:var(--accent)}} .ev2:active{transform:scale(.99)}
.ev2 .date{align-self:start;height:56px;display:flex;flex-direction:column;justify-content:center;border:0;border-radius:10px;background:var(--panel);padding:6px 0;min-height:52px;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}
.ev2 .date b{font-size:1.3rem;letter-spacing:0}
.ev2.ty-Klausur .date{background:var(--bad-soft);color:var(--bad)} .ev2.ty-Abgabe .date{background:var(--warn-soft);color:var(--warn)}
.ev2.ty-Termin .date{background:var(--info-soft);color:var(--info)} .ev2.ty-Zeitraum .date{background:var(--accent-soft);color:var(--accent)}
.ev2.soon{border-color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}
.ev2 .t{display:flex;flex-direction:column;gap:3px;min-width:0}
.ev2 .r1{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;min-width:0}
.ev2 .r1 .pill{flex-shrink:0}
.ev2 .r1 .pill{font-size:.68rem;padding:1px 7px}
.ev2 .when{margin-left:auto;font-family:var(--f-mono);font-size:.75rem;color:var(--muted);white-space:nowrap}
.ev2.soon .when{color:var(--bad);font-weight:500}
.ev2 .todo{font-size:.75rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
.ev2 .ttl{font-weight:600;line-height:1.3;overflow-wrap:break-word;hyphens:auto}
.ev2 .meta{gap:2px 14px;font-size:.78rem}
.ev2 .clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.8rem;line-height:1.4}
.ev2 .note{color:var(--muted)}
.ev2 .ann{font-family:var(--f-body)}
/* ---------- Tagesansicht ---------- */
button.cell{font:inherit;color:inherit;text-align:left;cursor:pointer;display:block;width:100%}
button.cell:hover{border-color:var(--accent)}
.cell.sel{border-color:var(--accent);background:var(--accent-soft)}
.cell .cnt{float:right;font-size:.65rem;background:var(--ink);color:var(--panel);border-radius:999px;padding:0 5px;line-height:1.5}
.daysheet{position:fixed;z-index:19;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);max-height:85vh;overflow-y:auto;background:var(--panel);
  border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.2)}
.daysheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px;cursor:pointer}
.daysheet .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.daynav{display:flex;justify-content:space-between;margin:12px 0}
.daylist{display:flex;flex-direction:column;gap:10px}
.daycard{border:1px solid var(--line);border-left:4px solid var(--info);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.daycard .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.daycard.dc-Klausur{border-left-color:var(--bad)} .daycard.dc-Abgabe{border-left-color:var(--warn)} .daycard.dc-Zeitraum{border-left-color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.daysheet{animation:up .2s ease-out}@keyframes up{from{transform:translate(-50%,30px);opacity:.5}}}
button.cell{position:relative}
.cell .cnt{position:absolute;top:3px;right:3px;float:none}
@media (max-width:640px){.cell.has .d{font-weight:700;color:var(--ink)}
  .cell .e.t-Klausur{background:var(--bad)} .cell .e.t-Abgabe{background:var(--warn)} .cell .e.t-Termin{background:var(--info)} .cell .e.t-Zeitraum{background:var(--accent);opacity:.35;height:3px}}
/* ---------- Handy-App ---------- */
html{-webkit-text-size-adjust:100%}
body{margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
.nav-ic{display:none}
.more-btn{display:none}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:.95rem;color:var(--ink)}
.switch:first-of-type{border-top:0}
.switch small{display:block;color:var(--muted);font-size:.8rem}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.checks label{flex-direction:row;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--ink);font-size:.88rem;cursor:pointer}
.checks input{accent-color:var(--accent);margin:0}
.steps{margin:8px 0 0;padding-left:20px}
.steps li{margin:4px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.88rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ok-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
.off-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:6px}
@media (max-width:760px){
  body{font-size:15.5px}
  .brand small{display:none}
  .bar{padding-block:10px}
  header .bar{min-height:48px}
  main{padding-block:16px calc(84px + env(safe-area-inset-bottom,0px))}
  h1{font-size:1.35rem}
  input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{font-size:16px}
  .btn{padding:10px 16px}
  .btn.small{padding:6px 12px}
  .chip{padding:7px 14px}
  nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:15;margin:0;gap:0;flex-wrap:nowrap;justify-content:space-around;
    background:var(--panel);border-top:1px solid var(--line);padding:4px max(6px,env(safe-area-inset-left,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-right,0px))}
  nav#nav a,nav#nav .more-btn{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:.68rem;border-radius:8px;min-width:0;white-space:nowrap}
  nav#nav .more-btn{border:0;background:none;color:var(--muted);font:inherit;font-size:.68rem;font-weight:500;cursor:pointer}
  nav#nav a[aria-current="page"],nav#nav .more-btn[aria-current="page"]{background:none}
  nav#nav a[aria-current="page"] .nav-ic,nav#nav .more-btn[aria-current="page"] .nav-ic{background:var(--accent-soft)}
  .nav-ic{display:block;width:44px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center}
  .nav-ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  nav#nav a.sec{display:none}
  nav#nav .more-btn{display:flex}
  nav#nav.open a.sec{display:flex;position:fixed;right:12px;width:230px;flex-direction:row;gap:10px;justify-content:flex-start;font-size:.95rem;
    background:var(--panel);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.18);padding:8px 12px}
  nav#nav.open a.sec .nav-ic{width:30px}
  nav#nav.open a.sec:nth-of-type(6){bottom:calc(72px + env(safe-area-inset-bottom,0px) + 104px)}

}

</style>

<main class="wrap" id="app">
  <div class="panel"><h2>Daten werden geladen …</h2><p class="muted">Module, Termine und Aufgaben kommen aus dem gespeicherten Planer.</p></div>
</main>
<div id="drawerRoot"></div>
<button class="btn primary fab" id="fab" hidden>Assistent</button>
<div id="asstRoot"></div>

<script>
(function(){
"use strict";
const SEMS=[
  {k:"WS26",l:"WS 2026/27",n:7},
  {k:"SS27",l:"SS 2027",n:8},
  {k:"WS27",l:"WS 2027/28",n:9},
  {k:"SS28",l:"SS 2028",n:10}
];
const STATUS=[
  {k:"läuft",l:"Läuft gerade",c:"s-läuft"},
  {k:"offen",l:"Noch offen",c:"s-offen"},
  {k:"unklar",l:"Status prüfen",c:"s-unklar"},
  {k:"nicht bestanden",l:"Nicht bestanden",c:"s-nb"},
  {k:"bestanden",l:"Bestanden",c:"s-bestanden"}
];
const TYPES=["Klausur","Abgabe","Termin","Zeitraum"];
const TOTAL_ECTS=210;
const state={ideas:[],sched:null,weekOff:0,mods:[],events:[],loaded:{m:false,e:false},db:null,err:"",slow:false,filter:"noch",calMonth:null,openMod:null,editEv:null};

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const stCls=k=>(STATUS.find(s=>s.k===k)||STATUS[2]).c;
const stLbl=k=>(STATUS.find(s=>s.k===k)||STATUS[2]).l;
const semLbl=k=>k==="done"?"Abgeschlossen":(SEMS.find(s=>s.k===k)||{l:"Nicht eingeplant"}).l;
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const parseD=s=>{const [y,m,d]=String(s).split("-").map(Number);return new Date(y,(m||1)-1,d||1)};
const daysUntil=s=>Math.round((parseD(s)-parseD(todayISO()))/864e5);
const MON=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const MONL=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const modName=id=>{const m=state.mods.find(x=>x.id===id);return m?m.name:""};
const uid=()=>Math.random().toString(36).slice(2,10);

/* ---------- routing ---------- */
const VIEWS=["ueberblick","woche","pruefungen","module","plan","termine","ideen","handy"];
function view(){const h=location.hash.slice(1);return VIEWS.includes(h)?h:"ueberblick"}
window.addEventListener("hashchange",()=>{state.day=null;render()});

/* ---------- data ---------- */
async function boot(){
  let db=null;
  try{await window.LocalDB.ready;db=window.LocalDB}catch(e){db=null}
  if(!db){state.err="Der Speicher auf diesem Gerät ist nicht erreichbar. Prüfe, ob der Browser im privaten Modus läuft.";render();return}
  state.db=db;
  const t=setTimeout(()=>{state.slow=true;render()},10000);
  const done=()=>{if(state.loaded.m&&state.loaded.e){clearTimeout(t);state.slow=false}};
  const onErr=e=>{clearTimeout(t);state.err="Die Daten konnten nicht geladen werden ("+(e&&e.code||"Fehler")+").";render()};
  db.collection("modules").onSnapshot(s=>{state.mods=s.docs.map(d=>Object.assign({id:d.id},d.data()));if(!s.metadata.fromCache){state.loaded.m=true;done()}render()},onErr);
  db.collection("ideas").onSnapshot(s=>{state.ideas=s.docs.map(d=>Object.assign({id:d.id},d.data()));if(view()==="ideen"&&document.activeElement&&document.activeElement.closest&&document.activeElement.closest(".idea"))return;render()},()=>{});
  db.doc("schedule/wise2026").onSnapshot(s=>{state.sched=s.exists?s.data():null;render()},()=>{});
  db.collection("events").onSnapshot(s=>{state.events=s.docs.map(d=>Object.assign({id:d.id},d.data()));if(!s.metadata.fromCache){state.loaded.e=true;done()}render()},onErr);
}
const busy={};
async function saveMod(id,patch){
  const m=state.mods.find(x=>x.id===id); if(!m||!state.db)return;
  Object.assign(m,patch); render();
  while(busy[id]) await busy[id];
  busy[id]=state.db.doc("modules/"+id).update(patch).catch(e=>flash("Speichern fehlgeschlagen: "+(e.code||e))).finally(()=>{busy[id]=null});
  await busy[id];
}
async function saveEvent(ev){
  if(!state.db)return;
  const id=ev.id||uid(); const body=Object.assign({},ev); delete body.id;
  try{await state.db.doc("events/"+id).set(body)}catch(e){flash("Speichern fehlgeschlagen: "+(e.code||e))}
}
async function delEvent(id){try{await state.db.doc("events/"+id).delete()}catch(e){flash("Löschen fehlgeschlagen")}}
let flashMsg="";function flash(m){flashMsg=m;render();setTimeout(()=>{flashMsg="";render()},4000)}

/* ---------- views ---------- */
function render(){
  const v=view();
  document.querySelectorAll("#nav a").forEach(a=>a.setAttribute("aria-current",a.getAttribute("href")==="#"+v?"page":"false"));
  const nv=document.getElementById("nav");nv.classList.remove("open");const mb=nv.querySelector(".more-btn");mb.setAttribute("aria-expanded","false");mb.setAttribute("aria-current",["plan","ideen","handy"].includes(v)?"page":"false");
  const app=document.getElementById("app");
  let html="";
  if(flashMsg) html+=`<div class="notice" role="status" style="margin-bottom:16px">${esc(flashMsg)}</div>`;
  if(state.err){app.innerHTML=html+`<div class="panel"><h2>Planer nicht verfügbar</h2><p class="muted">${esc(state.err)}</p></div>`;return}
  if(state.slow) html+=`<div class="notice" style="margin-bottom:16px">Die Verbindung zum Speicher dauert länger. Angezeigte Daten sind evtl. nicht aktuell.</div>`;
  if(!state.mods.length&&!state.loaded.m){app.innerHTML=html+`<div class="panel"><h2>Daten werden geladen …</h2></div>`;return}
  if(!state.mods.length){app.innerHTML=html+`<div class="panel"><h2>Noch keine Module</h2><p class="muted">Sobald deine Module aus Polli eingetragen sind, erscheinen sie hier. Du kannst über „Termine“ schon Prüfungen und Abgaben anlegen.</p></div>`;return}
  html+= v==="handy"?vHandy(): v==="ideen"?vIdeen(): v==="woche"?vWoche(): v==="pruefungen"?vPruefungen(): v==="module"?vModules(): v==="plan"?vPlan(): v==="termine"?vTermine(): vOverview();
  app.innerHTML=html;
  renderDrawer();
}

function ectsBy(st){return state.mods.filter(m=>m.status===st).reduce((a,m)=>a+(+m.ects||0),0)}
function vOverview(){
  const done=ectsBy("bestanden"), run=ectsBy("läuft"), open=ectsBy("offen")+ectsBy("nicht bestanden"), unk=ectsBy("unklar");
  const pct=x=>Math.min(100,x/TOTAL_ECTS*100).toFixed(1)+"%";
  const t=todayISO();
  const up=state.events.filter(e=>(e.end||e.date)>=t).sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||""))).slice(0,7);
  const tasks=[];state.mods.forEach(m=>(m.tasks||[]).forEach(k=>{if(!k.done)tasks.push({m,k})}));
  const check=state.mods.filter(m=>m.status==="unklar");
  const cur=state.mods.filter(m=>m.status==="läuft"||m.planSem==="WS26");
  return `<div class="stack">
  <div><div class="eyebrow">7. Fachsemester · WS 2026/27</div><h1>Hallo Hendrik, hier steht dein Studium.</h1>
  <p class="lead">Alles in einem Blick: was bestanden ist, was dieses Semester ansteht und welche Termine als Nächstes kommen.</p></div>
  ${check.length?`<div class="notice"><b>${check.length} Module ohne geklärten Status.</b> Die Liste stammt aus deinen Studienordnern. Ob du sie bestanden hast, steht erst fest, wenn die Polli-Daten da sind oder du den Status selbst setzt.</div>`:""}
  <div class="grid g2">
    <section class="panel"><h2>Fortschritt <span class="mono muted num" style="font-size:.85rem">${done} / ${TOTAL_ECTS} ECTS</span></h2>
      <div class="progress" aria-label="ECTS-Fortschritt"><span style="width:${pct(done)};background:var(--ok)"></span><span style="width:${pct(run)};background:var(--info)"></span><span style="width:${pct(open)};background:var(--warn)"></span><span style="width:${pct(unk)};background:var(--muted);opacity:.35"></span></div>
      <div class="legend"><span><i style="background:var(--ok)"></i>Bestanden</span><span><i style="background:var(--info)"></i>Läuft</span><span><i style="background:var(--warn)"></i>Offen</span><span><i style="background:var(--muted);opacity:.35"></i>Prüfen</span></div>
      <div class="kpis">
        <div class="kpi"><b>${state.mods.filter(m=>m.status==="bestanden").length}</b><span>Module bestanden</span></div>
        <div class="kpi"><b>${state.mods.filter(m=>m.status==="läuft").length}</b><span>laufen gerade</span></div>
        <div class="kpi"><b>${state.mods.filter(m=>m.status==="offen"||m.status==="nicht bestanden").length}</b><span>noch offen</span></div>
        <div class="kpi"><b>${check.length}</b><span>Status prüfen</span></div>
      </div>
      <p class="ann" style="margin:12px 0 0">Annahme: 210 ECTS Gesamtumfang, 5 ECTS je Modul, bis die echten Werte eingetragen sind.</p>
    </section>
    ${state.sched?(()=>{const d=parseD(t);let sl=slotsOn(d).filter(x=>!x.off),lbl="Heute";if(!sl.length){const n=new Date(d);for(let i=1;i<8&&!sl.length;i++){n.setDate(n.getDate()+1);sl=slotsOn(n).filter(x=>!x.off);lbl=i===1?"Morgen":["So","Mo","Di","Mi","Do","Fr","Sa"][n.getDay()]+", "+n.getDate()+". "+MON[n.getMonth()]}}
      return `<section class="panel"><h2>${esc(lbl)} an der Uni <a class="btn small" href="#woche">Woche</a></h2>${sl.length?`<div class="stack" style="gap:8px">${sl.map(slotCard).join("")}</div>`:`<p class="empty">Keine Veranstaltungen in den nächsten Tagen.</p>`}</section>`})():""}
    <section class="panel"><h2>Nächste Termine <a class="btn small" href="#termine">Alle</a></h2>
      ${up.length?`<ul class="clean">${up.map(evRow).join("")}</ul>`:`<p class="empty">Keine anstehenden Termine. Lege Klausuren und Abgaben unter „Termine“ an.</p>`}
    </section>
    <section class="panel"><h2>Offene Aufgaben <span class="mono muted num" style="font-size:.85rem">${tasks.length}</span></h2>
      ${tasks.length?`<ul class="clean">${tasks.slice(0,10).map(({m,k})=>`<li class="task"><input type="checkbox" id="tk-${esc(m.id)}-${esc(k.id)}" data-tm="${esc(m.id)}" data-tk="${esc(k.id)}"><span><label for="tk-${esc(m.id)}-${esc(k.id)}" style="display:inline;color:var(--ink);font-size:.95rem">${esc(k.t)}</label> <span class="muted" style="font-size:.8rem">· ${esc(m.name)}</span></span></li>`).join("")}</ul>`:`<p class="empty">Keine offenen Aufgaben. Aufgaben legst du im jeweiligen Modul an.</p>`}
    </section>
    <section class="panel"><h2>Dieses Semester <a class="btn small" href="#plan">Plan</a></h2>
      ${cur.length?`<ul class="clean">${cur.map(m=>`<li class="ev" style="grid-template-columns:1fr auto"><div class="t"><button class="name" data-open="${esc(m.id)}" style="all:unset;cursor:pointer;font-weight:500">${esc(m.name)}</button><div class="meta">${m.todo?esc(m.todo)+" · ":""}${m.altk?m.altk+" Altklausuren":"keine Altklausuren"}</div></div><span class="pill ${stCls(m.status)}">${esc(stLbl(m.status))}</span></li>`).join("")}</ul>`:`<p class="empty">Noch nichts für WS 2026/27 eingeplant.</p>`}
    </section>
  </div></div>`;
}
function whenTxt(n,e){return n<0&&e&&e.end?"läuft":n<0?"vorbei":n===0?"heute":n===1?"morgen":n<60?"in "+n+" Tagen":"in "+Math.round(n/30)+" Mon."}
function evRow(e){
  const d=parseD(e.date), n=daysUntil(e.date);
  const meta=[e.time?esc(e.time)+" Uhr":"",e.end?"bis "+esc(fmtD(e.end)):"",e.place?esc(e.place):"",e.moduleId&&modName(e.moduleId)&&!String(e.title||"").toLowerCase().includes(modName(e.moduleId).toLowerCase())?esc(modName(e.moduleId)):""].filter(Boolean);
  const warn=e.notes&&/zurückgetreten|nicht angemeldet|ACHTUNG/i.test(e.notes);
  return `<li class="ev ev2 ty-${esc(e.type)}${n<=7&&n>=0?" soon":""}" data-editev="${esc(e.id)}" role="button" tabindex="0" aria-label="${esc(e.title)} bearbeiten">
  <div class="date"><b class="num">${d.getDate()}</b>${MON[d.getMonth()]}</div>
  <div class="t">
    <div class="r1"><span class="pill t-${esc(e.type)}">${esc(e.type)}</span>${warn?`<span class="pill s-nb">Anmeldung prüfen</span>`:""}<span class="when">${whenTxt(n,e)}</span></div>
    <div class="ttl">${esc(e.title)}</div>
    ${meta.length?`<div class="meta">${meta.map(x=>`<span>${x}</span>`).join("")}</div>`:""}
    ${e.assumed?`<div class="clamp ann">Annahme: ${esc(e.assumed)}</div>`:""}
  </div></li>`;
}
const fmtD=s=>{const d=parseD(s);return d.getDate()+". "+MON[d.getMonth()]+" "+d.getFullYear()};

const isoD=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dn=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-dn);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
function mondayOf(off){const d=parseD(todayISO());d.setDate(d.getDate()-((d.getDay()+6)%7)+7*off);return d}
function slotsOn(date){
  const s=state.sched; if(!s)return [];
  const iso=isoD(date), dow=(date.getDay()+6)%7+1, even=isoWeek(date)%2===0;
  if(iso<s.lectureStart||iso>s.lectureEnd)return [];
  return (s.slots||[]).filter(x=>x.day===dow).map(x=>Object.assign({},x,{off:x.rhythm==="gerade"&&!even||x.rhythm==="ungerade"&&even})).sort((a,b)=>a.start.localeCompare(b.start));
}
function slotCard(x){
  return `<div class="slot${x.off?" off":""}"><div class="mono num" style="font-size:.78rem">${esc(x.start)}–${esc(x.end)}</div>
  <div style="font-weight:500">${x.moduleId&&modName(x.moduleId)?`<button class="name" data-open="${esc(x.moduleId)}" style="all:unset;cursor:pointer">${esc(x.title)}</button>`:esc(x.title)}</div>
  <div class="meta"><span>${esc(x.kind)}</span><span>${esc(x.room)}</span>${x.rhythm!=="w"?`<span>${x.rhythm==="gerade"?"gerade Wochen":"ungerade Wochen"}</span>`:""}</div>
  ${x.off?`<div class="ann" style="color:var(--muted)">Diese Woche nicht</div>`:""}${x.status&&x.status!=="zugelassen"?`<div class="ann">Polli: ${esc(x.status)}</div>`:""}</div>`;
}
function vWoche(){
  if(!state.sched)return `<div class="panel"><h2>Kein Stundenplan</h2><p class="muted">Der Stundenplan ist noch nicht eingetragen.</p></div>`;
  const mon=mondayOf(state.weekOff), kw=isoWeek(mon), fri=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+4);
  const t=todayISO(); const DN=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag"];
  const s=state.sched; const inLect=isoD(fri)>=s.lectureStart&&isoD(mon)<=s.lectureEnd;
  let cols="";
  for(let i=0;i<5;i++){const d=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i);const iso=isoD(d);
    const ev=state.events.filter(e=>e.date===iso&&e.type!=="Zeitraum");const sl=slotsOn(d);
    cols+=`<section class="day${iso===t?" today":""}"><header><h3>${DN[i]}</h3><span class="mono muted num">${d.getDate()}. ${MON[d.getMonth()]}</span></header>
    ${ev.map(e=>`<div class="slot ev-${esc(e.type)}"><div class="mono num" style="font-size:.78rem">${esc(e.time||"ganztägig")}</div><div style="font-weight:500">${esc(e.title)}</div>${e.place?`<div class="meta"><span>${esc(e.place)}</span></div>`:""}</div>`).join("")}
    ${sl.map(slotCard).join("")||(ev.length?"":`<p class="empty">Frei</p>`)}</section>`}
  return `<div class="stack"><div><div class="eyebrow">${esc(s.semester)} · Quelle: ${esc(s.source||"")}</div><h1>Stundenplan</h1>
  <p class="lead">Deine Woche mit Vorlesungen, Übungen und Prüfungen. Übungen im 14-Tage-Rhythmus erscheinen nur in den passenden Wochen.</p></div>
  <div class="cal-head"><button class="btn small" data-wk="-1" aria-label="Vorherige Woche">‹</button>
  <h2 style="text-align:center">KW ${kw} · ${kw%2===0?"gerade":"ungerade"} Woche<br><span class="mono muted" style="font-size:.8rem;font-weight:400">${mon.getDate()}. ${MON[mon.getMonth()]} – ${fri.getDate()}. ${MON[fri.getMonth()]} ${fri.getFullYear()}</span></h2>
  ${state.weekOff?`<button class="btn small" data-wk="0">Heute</button>`:""}<button class="btn small" data-wk="1" aria-label="Nächste Woche">›</button></div>
  ${inLect?"":`<div class="notice">Diese Woche liegt außerhalb der Vorlesungszeit (${esc(fmtD(s.lectureStart))} bis ${esc(fmtD(s.lectureEnd))}).</div>`}
  <div class="week">${cols}</div></div>`;
}

const ISTAT=["Idee","Will ich","Später","Umgesetzt","Verworfen"];
const ICLS={"Idee":"s-unklar","Will ich":"s-läuft","Später":"s-offen","Umgesetzt":"s-bestanden","Verworfen":"s-nb"};
function vIdeen(){
  const groups=[];state.ideas.slice().sort((a,b)=>(a.order||999)-(b.order||999)).forEach(i=>{const g=i.group||"Eigene Ideen";let G=groups.find(x=>x.g===g);if(!G)groups.push(G={g,items:[]});G.items.push(i)});
  return `<div class="stack"><div><div class="eyebrow">${state.ideas.length} Ideen</div><h1>Ideen für die App</h1>
  <p class="lead">Mögliche Updates zum Nachlesen. Ändere Titel und Beschreibung direkt im Text, setze einen Status oder füge eigene Ideen hinzu. Hier wird nichts automatisch gebaut.</p></div>
  <form class="panel addrow" id="f-addidea" style="flex-wrap:wrap"><input type="text" id="f-newidea" placeholder="Neue Idee, z. B. Lerngruppe planen" aria-label="Neue Idee" style="min-width:200px"><button class="btn primary" type="submit">Idee hinzufügen</button></form>

async function handyAct(a,el){

  if(a==="ics-exams"){window.SPTools.exportICS(["Klausur","Abgabe"]);return}

document.addEventListener("change",async e=>{

    try{await window.SPTools.importBackup(t.files[0]);flash("Sicherung geladen.")}catch(err){flash("Die Datei ist keine gültige Sicherung.")}

function vTermine(){
  const t=todayISO();
  if(!state.calMonth){const d=new Date();state.calMonth=[d.getFullYear(),d.getMonth()]}
  const [y,mo]=state.calMonth; const first=new Date(y,mo,1); const start=new Date(y,mo,1-((first.getDay()+6)%7));
  let cells="";
  for(let i=0;i<42;i++){
    const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
    const iso=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    const evs=state.events.filter(e=>e.date===iso||(e.end&&e.date<=iso&&e.end>=iso));
    const nIt=evs.length;
    cells+=`<button type="button" data-day="${iso}" aria-label="${d.getDate()}. ${MONL[d.getMonth()]}${nIt?", "+nIt+(nIt===1?" Eintrag":" Einträge"):""}" class="cell${d.getMonth()!==mo?" other":""}${iso===t?" today":""}${state.day===iso?" sel":""}${nIt?" has":""}"><div class="d num">${d.getDate()}${nIt>1?`<span class="cnt">${nIt}</span>`:""}</div>${evs.map(e=>`<span class="e t-${esc(e.type)}${e.end?" range":""}">${e.time&&!e.end?esc(e.time)+" ":""}${esc(e.title)}</span>`).join("")}</button>`;
  }
  const up=state.events.filter(e=>(e.end||e.date)>=t).sort((a,b)=>a.date.localeCompare(b.date));
  const past=state.events.filter(e=>(e.end||e.date)<t).sort((a,b)=>b.date.localeCompare(a.date));
  return `<div class="stack"><div><div class="eyebrow">Prüfungen, Abgaben, Fristen</div><h1>Termine</h1></div>
  <div class="grid g2">
  <section class="panel"><div class="cal-head"><button class="btn small" data-cal="-1" aria-label="Vorheriger Monat">‹</button><h2 style="text-align:center">${MONL[mo]} ${y}</h2><button class="btn small" data-cal="1" aria-label="Nächster Monat">›</button></div>
    <div class="cal">${["Mo","Di","Mi","Do","Fr","Sa","So"].map(d=>`<div class="dow">${d}</div>`).join("")}${cells}</div><p class="muted" style="font-size:.8rem;margin:8px 0 0">Tipp auf einen Tag, um alles zu sehen, was dann ansteht.</p></section>
  <section class="panel"><h2>Kommende Termine <button class="btn small primary" data-newev="1">Termin anlegen</button></h2>

  </section></div></div>`;
}

const TORDER={Klausur:0,Abgabe:1,Termin:2,Zeitraum:3};
function renderDay(){
  let root=document.getElementById("dayRoot");
  if(!root){root=document.createElement("div");root.id="dayRoot";document.body.appendChild(root)}
  const iso=state.day; if(!iso){root.innerHTML="";return}
  const d=parseD(iso), n=daysUntil(iso);
  const evs=state.events.filter(e=>e.date===iso||(e.end&&e.date<=iso&&e.end>=iso)).sort((a,b)=>(TORDER[a.type]??9)-(TORDER[b.type]??9)||(a.time||"").localeCompare(b.time||""));
  const sl=typeof slotsOn==="function"?slotsOn(d).filter(x=>!x.off):[];
  const when=n===0?"Heute":n===1?"Morgen":n===-1?"Gestern":n>1?"in "+n+" Tagen":"vor "+(-n)+" Tagen";
  const cnt={};evs.forEach(e=>cnt[e.type]=(cnt[e.type]||0)+1);
  const summary=Object.keys(cnt).sort((a,b)=>(TORDER[a]??9)-(TORDER[b]??9)).map(k=>`<span class="pill t-${esc(k)}">${cnt[k]} ${esc(k==="Klausur"&&cnt[k]>1?"Klausuren":k==="Abgabe"&&cnt[k]>1?"Abgaben":k==="Termin"&&cnt[k]>1?"Termine":k)}</span>`).join(" ");
  const card=e=>{const m=e.moduleId&&state.mods.find(x=>x.id===e.moduleId);
    const open=m?(m.topics||[]).filter(x=>!x.done).length:0, tasks=m?(m.tasks||[]).filter(x=>!x.done).length:0;

    }
    if(e.target.closest("[data-editev],[data-open]")&&state.day){state.day=null;renderDay()}

    if(h){ handyAct(h.dataset.act,h); return } }

  const el=e.target.closest("[data-open],[data-filter],[data-mv],[data-cal],[data-wk],[data-newev],[data-newexam],[data-editev],[data-close],[data-deltk],[data-deltp],[data-delidea]"); if(!el)return;
  if(el.dataset.delidea){if(el.dataset.armed){state.db&&state.db.doc("ideas/"+el.dataset.delidea).delete().catch(()=>flash("Löschen fehlgeschlagen"))}else{el.dataset.armed="1";el.textContent="Wirklich löschen?"}return}
  if(el.dataset.deltp){const m=state.mods.find(x=>x.id===state.openMod);if(m)saveMod(m.id,{topics:(m.topics||[]).filter(t=>t.id!==el.dataset.deltp)});return}

  if(el.dataset.cal){let [y,m]=state.calMonth;m+=+el.dataset.cal;if(m<0){m=11;y--}if(m>11){m=0;y++}state.calMonth=[y,m];render();return}
  if(el.dataset.newev){state.editEv={type:"Klausur"};state.openMod=null;renderDrawer();return}

  if(el.dataset.close){closeDrawer();return}

 {name:"set_items_done",description:"Hakt Themen oder Aufgaben eines Moduls ab (done=true) oder wieder auf (done=false). itemIds aus get_module.",inputSchema:S({p:{id:{type:"string"},kind:{type:"string",enum:["topic","task"]},itemIds:{type:"array",items:{type:"string"}},done:{type:"boolean"}},r:["id","kind","itemIds","done"]}),execute:i=>{const m=findMod(i.id);const f=i.kind==="task"?"tasks":"topics";const ids=(i.itemIds||[]).map(String);const p={};p[f]=(m[f]||[]).map(k=>ids.includes(k.id)?Object.assign({},k,{done:!!i.done}):k);return modPatch(m.id,p,(f==="tasks"?"Aufgaben":"Themen")+" abgehakt")}},
 {name:"remove_items",description:"Entfernt Themen oder Aufgaben aus einem Modul. itemIds aus get_module.",inputSchema:S({p:{id:{type:"string"},kind:{type:"string",enum:["topic","task"]},itemIds:{type:"array",items:{type:"string"}}},r:["id","kind","itemIds"]}),execute:i=>{const m=findMod(i.id);const f=i.kind==="task"?"tasks":"topics";const ids=(i.itemIds||[]).map(String);const p={};p[f]=(m[f]||[]).filter(k=>!ids.includes(k.id));return modPatch(m.id,p,(f==="tasks"?"Aufgaben":"Themen")+" entfernt")}},
 {name:"save_event",description:"Legt einen Termin an (ohne id) oder ändert einen (mit id). Gibt die id zurück.",inputSchema:S({p:{id:{type:"string"},title:{type:"string"},type:{type:"string"},date:{type:"string"},end:{type:"string"},time:{type:"string"},place:{type:"string"},moduleId:{type:"string"},notes:{type:"string"}}}),execute:async i=>{const old=i.id?state.events.find(e=>e.id===String(i.id)):null;if(i.id&&!old)throw new Error("Termin "+i.id+" gibt es nicht");const b=Object.assign({title:"",type:"Termin",date:"",end:"",time:"",place:"",moduleId:"",notes:"",assumed:""},old?strip(old):{});["title","type","date","end","time","place","moduleId","notes"].forEach(k=>{if(i[k]!==undefined)b[k]=String(i[k])});if(!/^\d{4}-\d{2}-\d{2}$/.test(b.date))throw new Error("Datum fehlt oder ist nicht YYYY-MM-DD");if(!b.title)throw new Error("Titel fehlt");if(i.date!==undefined)b.assumed="";const id=old?old.id:uid();recUndo("doc","events/"+id,old?strip(old):null);await state.db.doc("events/"+id).set(b);asstLog((old?"Termin geändert":"Termin angelegt")+" · "+b.title);return {id}}},
 {name:"delete_event",description:"Löscht einen Termin. Kann über Rückgängig wiederhergestellt werden.",inputSchema:S({p:{id:{type:"string"}},r:["id"]}),execute:async i=>{const old=state.events.find(e=>e.id===String(i.id));if(!old)throw new Error("Termin gibt es nicht");recUndo("doc","events/"+old.id,strip(old));await state.db.doc("events/"+old.id).delete();asstLog("Termin gelöscht · "+old.title);return "ok"}},
 {name:"add_idea",description:"Legt eine Idee für ein späteres App-Update an (Wünsche zu Aussehen oder Funktionen).",inputSchema:S({p:{title:{type:"string"},note:{type:"string"}},r:["title"]}),execute:async i=>{const id=uid();const max=state.ideas.reduce((a,x)=>Math.max(a,x.order||0),0);recUndo("doc","ideas/"+id,null);await state.db.doc("ideas/"+id).set({order:max+1,group:"Eigene Ideen",title:String(i.title),note:String(i.note||""),status:"Idee"});asstLog("Idee angelegt · "+i.title);return "ok"}}
];
async function doUndo(){const u=asst.undo;if(!u||!state.db)return;asst.undo=null;for(const x of u.slice().reverse()){try{if(x.old)await state.db.doc(x.path).set(x.old);else await state.db.doc(x.path).delete()}catch(e){flash("Rückgängig fehlgeschlagen")}}asst.turns.push({role:"assistant",content:"(Hendrik hat die letzten Änderungen rückgängig gemacht.)"});asstLog("Rückgängig gemacht");renderAsst()}
async function askAsst(text){
  if(!asst.sample||asst.busy||!text)return;
  asst.busy=true;asst.err="";asst.undo=null;asst.log=[];
  asst.turns.push({role:"user",content:text});asst.live="";renderAsst();
  asst.ctl=new AbortController();
  const turns=asst.turns.slice(-12);
  try{
    const {text:out}=await asst.sample([{role:"user",content:RULES+"\n\n"+ctxText()},...turns],{signal:asst.ctl.signal,tools:TOOLS,cache:false,onText:({text})=>{asst.live=text;renderAsst(true)}});
    asst.turns.push({role:"assistant",content:out});
  }catch(e){
    const msg={not_granted:"Du hast der App den Zugriff auf Claude nicht erlaubt.",sampling_disabled:"Claude ist für dieses Konto hier nicht verfügbar.",tools_unavailable:"Diese Ansicht kann keine Änderungen über den Assistenten ausführen.",rate_limited:"Gerade zu viele Anfragen. Versuch es gleich noch mal.",cancelled:"Gestoppt.",refused:"Claude hat die Anfrage abgelehnt. Formulier sie bitte anders."}[e&&e.code]||"Das hat nicht geklappt. Versuch es noch mal.";
    if(e&&e.text)asst.turns.push({role:"assistant",content:e.text});
    asst.err=msg; if(e&&["not_granted","sampling_disabled","not_declared","capability_disabled"].includes(e.code)){asst.sample=null}
  }finally{asst.busy=false;asst.live="";renderAsst()}
}
function renderAsst(liveOnly){
  const root=document.getElementById("asstRoot");
  const fab=document.getElementById("fab"); fab.hidden=!asst.sample||asst.open;
  if(!asst.open){root.innerHTML="";return}
  if(liveOnly){const l=document.getElementById("asst-live");if(l){l.textContent=asst.live;return}}
  const keep=document.getElementById("asst-in");const val=keep?keep.value:"";const focused=document.activeElement===keep;
  root.innerHTML=`<div class="scrim" data-asstclose="1"></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="asst-t">
   <div class="top"><div><div class="eyebrow">Mit Claude</div><h2 id="asst-t">Assistent</h2></div><button class="btn small" data-asstclose="1">Schließen</button></div>
   <p class="muted" style="margin:0;font-size:.85rem">Sag, was sich ändern soll, z. B. „Hak bei Mathe 3 Laplace ab“, „Trag die SE2-Abgabe am 15.12. ein“ oder „Setz Spanisch auf bestanden“. Wünsche zum Aussehen der App landen als Idee im Reiter Ideen.</p>
   <div class="chat">${asst.turns.map(t=>`<div class="bubble ${t.role==="user"?"me":"ai"}">${esc(t.content)}</div>`).join("")}
   ${asst.log.map(l=>`<div class="bubble log">✓ ${esc(l)}</div>`).join("")}
   ${asst.busy?`<div class="bubble ai" id="asst-live">${esc(asst.live||"Denkt nach …")}</div>`:""}
   ${asst.err?`<div class="notice">${esc(asst.err)}</div>`:""}
   ${!asst.busy&&asst.undo&&asst.undo.length?`<button class="btn small" data-asstundo="1" style="align-self:flex-start">Änderungen rückgängig machen</button>`:""}</div>
   <form class="addrow" id="asst-form"><input type="text" id="asst-in" placeholder="Was soll ich ändern?" aria-label="Nachricht an den Assistenten" ${asst.sample?"":"disabled"}>
   ${asst.busy?`<button class="btn" type="button" data-asststop="1">Stopp</button>`:`<button class="btn primary" type="submit">Senden</button>`}</form>
  </aside>`;
  const inp=document.getElementById("asst-in");inp.value=val;if(focused||!asst.busy)inp.focus();
  const ch=root.querySelector(".drawer");ch.scrollTop=ch.scrollHeight;
}
document.getElementById("fab").addEventListener("click",()=>{asst.open=true;state.openMod=null;state.editEv=null;renderDrawer();renderAsst()});
document.addEventListener("click",e=>{const el=e.target.closest("[data-asstclose],[data-asstundo],[data-asststop]");if(!el)return;
  if(el.dataset.asstclose){asst.open=false;renderAsst()} else if(el.dataset.asstundo){doUndo()} else if(el.dataset.asststop){asst.ctl&&asst.ctl.abort()}});
document.addEventListener("submit",e=>{if(e.target.id!=="asst-form")return;e.preventDefault();const i=document.getElementById("asst-in");const v=i.value.trim();if(!v)return;i.value="";askAsst(v)});
(async()=>{try{const s=window.claude&&window.claude.use?await window.claude.use("sample"):null;if(!s)return;const lim=await s.limits().catch(()=>null);if(lim&&!lim.tools)return;asst.sample=s;renderAsst()}catch(e){}})();

render();
boot();
document.addEventListener("sp:installable",()=>{if(view()==="handy")render()});
window.addEventListener("online",()=>{if(view()==="handy")render()});window.addEventListener("offline",()=>{if(view()==="handy")render()});
})();
</script>
